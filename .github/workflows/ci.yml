name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # No DATABASE_URL -> db:migrate is a no-op; PGLite migrates locally.
          DATABASE_URL: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Headless Chromium only; the Playwright runner manages its own server.
      - run: npm run e2e:install
      - run: npm run e2e
        env:
          CI: "true"
          # Keep the repo's live-preview port (8080); CI runners have it free.
          E2E_PORT: "8080"
          # No DATABASE_URL -> PGLite fallback; db:migrate is a no-op.
          DATABASE_URL: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
